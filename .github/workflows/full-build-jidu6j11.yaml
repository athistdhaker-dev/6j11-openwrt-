name: Build JIDU6J11 Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: [6111, 6411, 6611, 6811, 6911]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /var/lib/docker
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Locate and extract PR-files zip
        run: |
          ZIPFILE=$(find . -maxdepth 1 -name "jidu6j11-build*.zip" | head -n1)
          if [ -z "$ZIPFILE" ]; then
            echo "No jidu6j11-build*.zip found at repo root!"
            exit 1
          fi
          echo "Found: $ZIPFILE"
          unzip -o "$ZIPFILE" -d jidu6j11-src
          ls jidu6j11-src

      - name: Clone OpenWrt master
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git src

      - name: Copy PR files onto tree (no fetch/cherry-pick)
        run: |
          cp -r jidu6j11-src/pr-files/. src/

      - name: Bake uci-defaults + Aurora theme
        run: |
          mkdir -p src/files/etc/uci-defaults src/files/etc/custom-pkgs
          cp jidu6j11-src/99-jiorouter-jidu6j11-setup.txt src/files/etc/uci-defaults/99-custom-config
          chmod +x src/files/etc/uci-defaults/99-custom-config
          cp jidu6j11-src/custom-pkgs/*.apk src/files/etc/custom-pkgs/

      - name: Write .config
        working-directory: src
        run: |
          cat > .config << EOF
          CONFIG_TARGET_qualcommbe=y
          CONFIG_TARGET_qualcommbe_ipq95xx=y
          CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_jiorouter_ax6000-jidu6j11-${{ matrix.device }}=y
          # CONFIG_PACKAGE_luci-app-attendedsysupgrade is not set
          # CONFIG_PACKAGE_attendedsysupgrade-common is not set
          EOF

      - name: Update feeds
        working-directory: src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Make defconfig
        working-directory: src
        run: make defconfig

      - name: Download sources
        working-directory: src
        run: make download -j$(nproc)

      - name: Build firmware
        working-directory: src
        run: |
          # NOTE: do NOT pass FILES=files on the make command line. It overrides every
          # package's own FILES variable (e.g. kmod-gpio-button-hotplug) and breaks
          # kmod packaging ("module 'files' is missing"). OpenWrt automatically
          # includes $(TOPDIR)/files in the rootfs.
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        working-directory: src
        run: |
          mkdir -p ../out
          find bin/targets/qualcommbe/ipq95xx/ -maxdepth 1 -type f \
            \( -name "*jidu6j11-${{ matrix.device }}*factory.ubi" \
            -o -name "*jidu6j11-${{ matrix.device }}*kernel.bin" \
            -o -name "*jidu6j11-${{ matrix.device }}*initramfs-uImage.itb" \
            -o -name "*jidu6j11-${{ matrix.device }}*sysupgrade.bin" \) \
            -exec cp {} ../out/ \;
          ls -la ../out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jidu6j11-${{ matrix.device }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: [6111, 6411, 6611, 6811, 6911]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jidu6j11-${{ matrix.device }}
          path: release-files

      - name: Delete old release (if exists)
        run: |
          gh release delete jidu6j11-${{ matrix.device }} --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jidu6j11-${{ matrix.device }}
          name: JIDU6J11-${{ matrix.device }} (snapshot)
          make_latest: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
